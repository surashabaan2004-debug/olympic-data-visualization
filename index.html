<!DOCTYPE html>
<html lang="en">
<head>
    <!---- Sets character encoding for proper text display -->
    <meta charset="UTF-8">
    
    <!-- Makes the page responsive on all screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title shown in the browser tab -->
    <title>Olympic Medals Europe (1996-2024)</title>
    
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Load D3.js library for data visualization and maps -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>

<body>

    <!-- Main page heading -->
    <h1>European Olympic Summer Games Medals (1996-2024)</h1>

    <!-- Year filter control section -->
    <div id="controls">
        <label for="yearSelect"><strong>Select Year:</strong></label>
        
        <!-- Dropdown menu for selecting a year or all years -->
        <select id="yearSelect">
            <option value="all">Overall (1996-2024)</option>
            <option value="1996">1996</option>
            <option value="2000">2000</option>
            <option value="2004">2004</option>
            <option value="2008">2008</option>
            <option value="2012">2012</option>
            <option value="2016">2016</option>
            <option value="2020">2020</option>
            <option value="2024">2024</option>
        </select>
    </div>

    <!-- Main dashboard layout -->
    <div id="dashboard">
        
        <!-- Map section container -->
        <div id="map-container">
            <div id="map"></div>
            <div id="legend"></div>
        </div>
        
        <!-- Sidebar information panel -->
        <div id="sidebar">
            
            <!-- Top 3 countries display -->
            <div class="info-box">
                <h2>Top 3 Countries</h2>
                <div id="top3-content">Loading data...</div>
            </div>
            
            <!-- Selected country details -->
            <div class="info-box">
                <h2>Selected Country</h2>
                <div id="country-content">Loading data...</div>
            </div>
        </div>
        
    </div>

    <!-- Tooltip shown on hover -->
    <div id="tooltip" class="hidden"></div>

    <!-- Main JS file -->
    <script src="script.js"></script>
</body>
</html>
